name: Demo site

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "skills/**"
      - "tools/build.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the web demo
        run: python tools/build.py site
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true
      - name: Build the Flutter demo into /flutter/
        working-directory: examples/flutter_cafe
        run: |
          flutter create --platforms=web --project-name flutter_cafe --no-pub .
          flutter pub get
          flutter build web --release --base-href /ui-ux-sketchbook/flutter/
          cp -r build/web ../../site/flutter
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

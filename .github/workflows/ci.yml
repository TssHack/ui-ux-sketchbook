name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Skill frontmatter, referenced files, versions, changelog
        run: python tools/validate.py
      - name: Claude Code plugin validator
        run: npx -y @anthropic-ai/claude-code@2.1.308 plugin validate .
      - name: Python scripts compile
        run: python -m py_compile tools/*.py skills/ui-ux-sketchbook/scripts/*.py
      - name: No SVG filters in the primitives
        run: |
          if grep -nE "feTurbulence|feDisplacementMap|filter: *url\(#" skills/ui-ux-sketchbook/assets/vanilla/*.js skills/ui-ux-sketchbook/assets/components/*; then
            echo "::error::SVG filters found in the primitives (they are too slow at page scale)"; exit 1
          fi

  code:
    name: JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Syntax-check the plain-JS build
        run: npm run check:js
      - name: Type-check the React build
        run: npm run typecheck

  flutter:
    name: Flutter package and example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Dart illustration library matches the JS one
        run: |
          node tools/gen_flutter_art.js
          git diff --exit-code -- skills/ui-ux-sketchbook/assets/flutter/lib/src/art_library.dart
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true
      - name: Package - analyze and test
        working-directory: skills/ui-ux-sketchbook/assets/flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Example - analyze, test and build for web
        working-directory: examples/flutter_cafe
        run: |
          flutter create --platforms=web --project-name flutter_cafe --no-pub .
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --base-href /ui-ux-sketchbook/flutter/

  build:
    name: Build packages and demo
    runs-on: ubuntu-latest
    needs: [validate, code]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: python tools/build.py
      - name: Archives contain the skill
        run: |
          tar -tzf dist/ui-ux-sketchbook.tar.gz | grep -qx "ui-ux-sketchbook/SKILL.md"
          python -c "import zipfile; assert 'ui-ux-sketchbook/SKILL.md' in zipfile.ZipFile('dist/ui-ux-sketchbook.zip').namelist()"
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ui-ux-sketchbook-packages
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: demo-site
          path: site/

  install-unix:
    name: Installer (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck install.sh
      - name: Install from the checkout
        run: |
          sh install.sh --dir "$RUNNER_TEMP/skills" --agent claude --agent hermes
          test -f "$RUNNER_TEMP/skills/ui-ux-sketchbook/SKILL.md"
          test -f "$HOME/.claude/skills/ui-ux-sketchbook/assets/vanilla/sketchbook.js"
          test -f "$HOME/.hermes/skills/ui-ux-sketchbook/SKILL.md"

  install-windows:
    name: Installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install from the checkout
        shell: pwsh
        run: |
          ./install.ps1 -Dir "$env:RUNNER_TEMP\skills" -Agent claude
          if (-not (Test-Path "$env:RUNNER_TEMP\skills\ui-ux-sketchbook\SKILL.md")) { throw "custom dir install failed" }
          if (-not (Test-Path "$HOME\.claude\skills\ui-ux-sketchbook\SKILL.md")) { throw "claude install failed" }
